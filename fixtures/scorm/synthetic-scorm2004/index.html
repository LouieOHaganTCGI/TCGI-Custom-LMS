<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Synthetic governance lesson</title>
  <link rel="stylesheet" href="lesson.css">
</head>
<body>
  <main>
    <p class="banner">SYNTHETIC TEST PACKAGE. This is not a TCGI Rise export. It is used only to test LMS plumbing.</p>
    <h1>Synthetic governance lesson</h1>

  <script src="lesson.js"></script>
