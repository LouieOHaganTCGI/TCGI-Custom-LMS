name: ci
on:
  push:
  pull_request:
permissions:
  contents: read

jobs:
  checks:
    name: typecheck, lint, tests, contracts, audit, build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci-only-postgres
        ports: ["54329:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGPASSWORD: ci-only-postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Create database roles
        run: |
          psql -h 127.0.0.1 -p 54329 -U postgres -v ON_ERROR_STOP=1 -f scripts/pg-ci-init.sql
          for db in lms_test lms_e2e; do psql -h 127.0.0.1 -p 54329 -U postgres -d $db -c "REVOKE ALL ON SCHEMA public FROM PUBLIC"; done
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run contracts:validate
      - name: Dependency audit (fail on high/critical)
        run: npm audit --audit-level=high
      - run: npm run build

  e2e:
    name: end-to-end (Playwright)
    needs: checks
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci-only-postgres
        ports: ["54329:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGPASSWORD: ci-only-postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: |
          psql -h 127.0.0.1 -p 54329 -U postgres -v ON_ERROR_STOP=1 -f scripts/pg-ci-init.sql
          for db in lms_test lms_e2e; do psql -h 127.0.0.1 -p 54329 -U postgres -d $db -c "REVOKE ALL ON SCHEMA public FROM PUBLIC"; done
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  image:
    name: container image build (no push)
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t tcgi-lms:ci .
